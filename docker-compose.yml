version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flask_db
      MYSQL_USER: flask_user
      MYSQL_PASSWORD: flask_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: flask_app
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: flask_db
      DB_USER: flask_user
      DB_PASS: flask_pass
      DB_PORT: 3306
    ports:
      - "5000:5000"
    volumes:
      - ./:/app

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
